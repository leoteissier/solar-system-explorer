stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_PROD: "$CI_REGISTRY_IMAGE:latest"

build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile -t "$DOCKER_IMAGE_PROD" .
    - docker push "$DOCKER_IMAGE_PROD"

deploy_job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - ssh $VPS_USER@$VPS_HOST "docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY'"
    - ssh $VPS_USER@$VPS_HOST "docker pull '$DOCKER_IMAGE_PROD'"
    - ssh $VPS_USER@$VPS_HOST "docker stop $PROJECT_NAME || true && docker rm $PROJECT_NAME || true"
    - ssh $VPS_USER@$VPS_HOST "docker run -d --name $PROJECT_NAME -p $PORT '$DOCKER_IMAGE_PROD'"
  only:
    - main
